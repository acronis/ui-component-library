spec_version: '1.0'
component: AspectRatio
name: aspect-ratio
status: draft
category: layout
description: >-
  A layout-only primitive that constrains its box to a given width-to-height
  ratio (via the native CSS `aspect-ratio`); the child — an image, video, map, or
  any box — fills it. Ported from the legacy shadcn-uikit `aspect-ratio`.
since: 0.55.0
