spec_version: '1.0'
component: Alert

schematic: |
  alert: <div role="alert"> — white surface, strong status border, rounded
    alert-accent:   6px full-height left bar in the strong status color
    alert-icon:     leading variant-driven full-color status icon
    alert-content:  text column
      alert-title:        short heading
      alert-description:  supporting text
      alert-actions:      (optional) action buttons under the description
    alert-actions:  (optional) action buttons at the right edge
    alert-close:    (optional) compact dismiss (×) button

root:
  element: div
  role: alert
  description: >-
    The banner container — a white surface (bg-background), rounded, with a strong
    status border (--ui-border-on-status-*-strong) and a 6px left accent bar in
    the strong status background. Title/description use the normal foreground; the
    leading icon is a variant-driven full-color status glyph. role="alert" so
    assistive tech announces it.

parts:
  - id: alert
    element: div
    description: The banner root (role=alert); the variant drives its border, accent bar, and default icon.
  - id: alert-accent
    element: span
    description: >-
      The 6px full-height left bar in the strong status background
      (--ui-background-status-strong-*); decorative (aria-hidden).
  - id: alert-icon
    element: div
    description: >-
      Leading status-icon slot. Empty, it renders the variant's default full-color
      icon (info → CircleInfoBlue, success → CircleCheckGreen, warning →
      TriangleWarningYellow, critical → CircleWarningOrange, destructive →
      DiamondWarningRed, neutral → CircleMinusGray, ai → AcronisAiMulti); pass
      children to override.
  - id: alert-content
    element: div
    description: The text column beside the icon (title + description).
  - id: alert-title
    element: h5
    description: A short heading for the alert.
  - id: alert-description
    element: div
    description: Supporting text under the title.
  - id: alert-actions
    element: div
    description: >-
      Optional action buttons. Placed as a direct child of the alert (after the
      content) they sit at the right edge; placed inside the content they flow
      under the description.
  - id: alert-close
    element: button
    description: >-
      Optional dismiss (×) button (the design's `Dismissable`) — a compact 32px
      ButtonIcon with a neutral glyph, a hover surface, and a focus ring; wire its
      onClick to hide the alert.

states:
  - id: variant
    trigger: variant selects the severity
    kind: prop
    prop: variant
    affects: [alert]
