spec_version: '1.0'
component: Alert

schematic: |
  alert: <div role="alert"> — rounded, subtle status border, pale status surface
    alert-icon:     leading status-tinted icon
    alert-content:  text column
      alert-title:        short heading
      alert-description:  supporting text
      alert-actions:      (optional) action buttons under the description
    alert-actions:  (optional) action buttons at the right edge
    alert-close:    (optional) dismiss (×) button at the right edge

root:
  element: div
  role: alert
  description: >-
    The banner container — rounded, with a subtle border in the status color
    (--ui-border-on-status-*) and a pale status surface; the text is the normal
    foreground and the icon (and dismiss glyph) are tinted with the status color.
    role="alert" so assistive tech announces it.

parts:
  - id: alert
    element: div
    description: The banner root (role=alert); the variant drives its colors.
  - id: alert-icon
    element: div
    description: Leading slot for a status icon.
  - id: alert-content
    element: div
    description: The text column beside the icon (title + description).
  - id: alert-title
    element: h5
    description: A short heading for the alert.
  - id: alert-description
    element: div
    description: Supporting text under the title.
  - id: alert-actions
    element: div
    description: >-
      Optional action buttons. Placed as a direct child of the alert (after the
      content) they sit at the right edge; placed inside the content they flow
      under the description.
  - id: alert-close
    element: button
    description: >-
      Optional dismiss (×) button (the design's `Dismissable`) — a full-height
      cell at the right edge with a left-border divider and a centered ×. Its
      divider, glyph, and hover surface are tinted by the variant; wire its
      onClick to hide the alert.

states:
  - id: variant
    trigger: variant selects the severity
    kind: prop
    prop: variant
    affects: [alert]
