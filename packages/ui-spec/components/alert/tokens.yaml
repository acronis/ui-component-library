spec_version: '1.0'
component: Alert

# References only. Values live in @constructor-lab/tokens. Reconciled with the Figma
# "Alert" set (node 4313-4953): a subtle status border (--ui-border-on-status-*),
# a pale status surface (--ui-background-status-*), foreground text, and a
# status-tinted icon / close glyph (--ui-glyph-on-status-*). The dismiss button's
# hover surface uses --ui-background-status-*-hover. Figma's `Unknown` = neutral.
source: '@constructor-lab/tokens'

tokens:
  - name: --ui-text-on-surface-primary
    affects: alert
    description: Title / description text (text-foreground) — all variants.
  - name: --ui-focus-primary
    affects: alert-close
    description: Focus ring on the dismiss button.

  # ── info ──
  - name: --ui-background-status-info
    affects: alert
  - name: --ui-border-on-status-info
    affects: alert
  - name: --ui-glyph-on-status-info
    affects: alert-icon
  - name: --ui-background-status-info-hover
    affects: alert-close

