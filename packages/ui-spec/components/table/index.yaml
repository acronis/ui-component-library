spec_version: '1.0'
component: Table
name: table
status: ready
category: data-display
layer: primitive
description: >-
  The semantic, presentational primitive for tabular content: native header,
  body, footer, row, column-header, cell, and caption parts plus visual row
  states, sort affordances, and overflow. Table deliberately owns no data or
  feature state. DataTable renders its shared-state engine through these parts,
  and DataGrid is the opinionated facade over DataTable. The React primitive is
  shipped; the additional current/expanded row affordances and complex-header
  scope contract are accepted P0/P1 target behavior.
since: 0.10.0
