spec_version: '1.0'
component: Table

# References only. Values live in @constructor-lab/tokens (generated from
# @constructor-lab/tokens) and resolve per brand/theme at paint time.
# Table has its own `--ui-table-*` component tier (opt-in via an @import in
# ui-react's styles/index.css); the sort-button focus ring reuses the shared
# semantic `--ui-focus-primary`.
source: '@constructor-lab/tokens'

tokens:
  - {
      name: --ui-table-data-value-color-idle,
      affects: root,
      description: Default cell text color,
    }
  - {
      name: --ui-table-global-row-border-color,
      affects: row,
      description: Row / cell divider color,
    }
  - {
      name: --ui-table-global-cell-padding-x,
      affects: cell,
      description: Cell horizontal padding,
    }
  - {
      name: --ui-table-global-cell-padding-y,
      affects: cell,
      description: Cell vertical padding,
    }
  - {
      name: --ui-table-data-row-color-idle,
      affects: row,
      description: Row background — idle,
    }
  - {
      name: --ui-table-data-row-color-hover,
      affects: row,
      description: Row background — hover,
    }
  - {
      name: --ui-table-data-row-color-active,
      affects: row,
      description: Row background — selected/active,
    }
  - {
      name: --ui-table-global-cell-padding-x,
      affects: head,
      description: Header cell horizontal padding,
    }
  - {
      name: --ui-table-header-cell-color-hover,
      affects: head,
      description: Sortable header background — hover,
    }
  - {
      name: --ui-table-header-label-color,
      affects: head,
      description: Header label text color,
    }
  - {
      name: --ui-table-header-gap,
      affects: head,
      description: Gap between header label and sort icon,
    }
  - {
      name: --ui-table-header-sort-icon-size,
      affects: head,
      description: Sort icon size (16px),
    }
  - {
      name: --ui-table-header-sort-icon-color-active,
      affects: head,
      description: Sort icon color when sorted,
    }
  - {
      name: --ui-table-header-sort-icon-color-inactive,
      affects: head,
      description: Sort icon color when unsorted,
    }
  - {
      name: --ui-focus-primary,
      affects: head,
      description: Focus-visible ring on the sort button,
    }

  # Presentation cluster (size / background / borders / sticky). The
  # `--ui-table-*` tier defines one set of cell metrics and no surface or
  # border-strength members, so these reach for the shared semantic and unit
  # tiers. `background` is bridged where a Tailwind name exists (`subtle` ->
  # muted, `surface` -> background); the other two reference their token
  # directly — see the note in table.tsx.
  - {
      name: --ui-background-surface-transparent,
      affects: root,
      description: Background surface — transparent variant,
    }
  - {
      name: --ui-background-surface-active,
      affects: root,
      description: Background surface — accent variant (and its sticky surface),
    }
  - {
      name: --ui-background-surface-secondary,
      affects: root,
      description: Background surface — subtle variant (and its sticky surface),
    }
  - {
      name: --ui-background-surface-primary,
      affects: root,
      description: Background surface — surface variant; also the fallback sticky surface,
    }
  - {
      name: --ui-border-on-surface-divider,
      affects: root,
      description: Border dimension — subtle strength,
    }
  - {
      name: --ui-border-on-surface-border-active,
      affects: root,
      description: Border dimension — strong strength; also the current-row marker,
    }
  - {
      name: --ui-units-size-32,
      affects: cell,
      description: Cell min height — small density,
    }
  - {
      name: --ui-units-size-48,
      affects: cell,
      description: Cell min height — large density,
    }
  - {
      name: --ui-units-size-8,
      affects: cell,
      description: Cell horizontal padding — small density,
    }
  - {
      name: --ui-units-gap-4,
      affects: cell,
      description: Cell vertical padding — small density,
    }
  - {
      name: --ui-units-gap-12,
      affects: cell,
      description: Cell vertical padding — large density,
    }
