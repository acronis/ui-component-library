spec_version: '1.0'
component: ButtonGroup
name: button-group
status: draft
category: buttons-actions
description: >-
  Groups adjacent buttons (and related controls) into a single segmented unit —
  collapsing their shared inner edges — in a horizontal or vertical orientation.
  Includes a static text/icon addon and a divider part.
since: 0.55.0
dependencies:
  components: [button, separator]
