spec_version: '1.0'
component: Calendar
name: calendar
status: draft
category: forms
layer: primitive
description: >-
  A themed date calendar for selecting a single date, multiple dates, or a range.
  Wraps `react-day-picker` (`DayPicker`) with `--ui-*` token styling and the
  design system's chevron icons; supports month/dropdown captions, outside &
  disabled days, and full keyboard navigation. Ported from the legacy
  shadcn-uikit `calendar`.
since: 0.55.0
dependencies:
  components: []
# Runtime dep: react-day-picker@10 (see README).
figma:
  node: '8148:10167'
  codeConnect: packages/ui-react/src/components/ui/calendar/calendar.figma.tsx
# Reconciled with the design (node 8148:10167): the `--ui-calendar-*` tier is
# emitted and bound, the caption is the design's month/year select pair, weeks
# start on Monday, `range` shows two months, and the action row uses the Footer
# tier. Remaining design detail NOT implemented: the caption selects are the
# generic `InputSelect` at its default size rather than a calendar-specific
# compact variant.
