spec_version: '1.0'
component: Calendar

# Calendar has no cva axes; its props ARE react-day-picker's `DayPicker` props
# (`CalendarProps = React.ComponentProps<typeof DayPicker>`). The key ones are
# documented here — see the react-day-picker docs for the full surface (matchers,
# formatters, locale, etc.).
contract:
  properties:
    - name: mode
      type: "'single' | 'multiple' | 'range'"
      required: false
      description: Selection mode — one date, many dates, or a contiguous range.
    - name: selected
      type: 'Date | Date[] | DateRange | undefined'
      required: false
      description: The controlled selected value (shape depends on `mode`).
    - name: defaultMonth
      type: Date
      required: false
      description: The month shown on first render (uncontrolled month).
    - name: captionLayout
      type: "'label' | 'dropdown' | 'dropdown-months' | 'dropdown-years'"
      required: false
      default: dropdown
      description: >-
        `dropdown` (the design, and the default) captions the month with two
        `InputSelect`s and hides the chevron nav — navigation happens through
        them. `label` restores react-day-picker's own caption label plus prev /
        next buttons.
    - name: showOutsideDays
      type: boolean
      required: false
      default: true
      description: Render the trailing/leading days of adjacent months.
    - name: weekStartsOn
      type: '0 | 1 | 2 | 3 | 4 | 5 | 6'
      required: false
      default: 1
      description: >-
        First day of the week; 1 (Monday) per the design. A `locale` overrides
        it with the locale's own first day.
    - name: numberOfMonths
      type: number
      required: false
      description: >-
        How many months to display side by side. Defaults to 2 when
        `mode="range"` (the design's range variant), otherwise 1.
    - name: footer
      type: ReactNode
      required: false
      description: >-
        The design's action row (Cancel / Apply on the multiple and range
        variants), banded with the Footer tier. Content is the host's; the
        calendar only styles the band.
    - name: disabled
      type: 'Matcher | Matcher[]'
      required: false
      description: Days to disable (a date, range, day-of-week, predicate, …).

  events:
    - name: select
      payload: 'Date | Date[] | DateRange | undefined'
      description: >-
        Fires when the selection changes (React: `onSelect`). Payload shape
        depends on `mode`.

  content: []

  methods: []

adapters:
  react:
    component: Calendar
    status: implemented
    import: "import { Calendar } from '@constructor-lab/ui-react'"
    example: |
      const [date, setDate] = React.useState<Date>();
      <Calendar mode="single" selected={date} onSelect={setDate} />
  vue:
    component: AvCalendar
    status: planned
    import: "import { AvCalendar } from '@constructor-lab/ui-vue'"
    example: |
      <AvCalendar mode="single" v-model="date" />
  web-components:
    element: ui-calendar
    status: planned
    import: "import '@constructor-lab/ui-wc/calendar'"
    example: |
      <ui-calendar mode="single"></ui-calendar>
