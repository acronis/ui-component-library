spec_version: '1.0'
component: Calendar

# References only. Values live in @constructor-lab/tokens and resolve per brand/theme at
# paint time. The token schema forbids a value/default key here.
#
# Calendar now binds its OWN `--ui-calendar-*` tier (Figma node 8148:10167,
# emitted into tiers/components.json). Only two things come from elsewhere: the
# shared focus token, and the footer band — the design's action row is a
# DialogFooterDefault, so it uses the Footer tier.
source: '@constructor-lab/tokens'

tokens:
  # ── container (the bordered panel) ──
  - name: --ui-calendar-container-color
    affects: root
  - name: --ui-calendar-container-border-color
    affects: root
  - name: --ui-calendar-container-border-width
    affects: root
  - name: --ui-calendar-container-border-style
    affects: root
  - name: --ui-calendar-container-border-radius # the panel only — items are square
    affects: root

  # ── header (the month/year caption band) ──
  - name: --ui-calendar-header-padding-x
    affects: caption
  - name: --ui-calendar-header-padding-y
    affects: caption
  - name: --ui-calendar-header-gap # between the month and year selects
    affects: caption
  - name: --ui-calendar-header-border-color # rule under the caption
    affects: caption
  - name: --ui-calendar-header-border-width
    affects: caption
  - name: --ui-calendar-header-border-style
    affects: caption

  # ── body (the grid band) ──
  - name: --ui-calendar-body-padding-x
    affects: grid
  - name: --ui-calendar-body-padding-y
    affects: grid
  - name: --ui-calendar-body-border-color
    affects: grid
  - name: --ui-calendar-body-border-width
    affects: grid
  - name: --ui-calendar-body-border-style
    affects: grid

  # ── day cell (the 32×32 item box) ──
  - name: --ui-calendar-item-width-min
    affects: day
  - name: --ui-calendar-item-height-min
    affects: day
  - name: --ui-calendar-item-color-idle
    affects: day
  - name: --ui-calendar-item-color-hover # also the range-middle track
    affects: day
  - name: --ui-calendar-item-color-active # selected day / range endpoints
    affects: day
  - name: --ui-calendar-item-border-idle
    affects: day
  - name: --ui-calendar-item-border-hover
    affects: day
  - name: --ui-calendar-item-border-active
    affects: day

  # ── day value (the numeral) ──
  - name: --ui-calendar-value-color-idle-primary # in-month day
    affects: day
  - name: --ui-calendar-value-color-idle-secondary # weekday header labels
    affects: weekday
  - name: --ui-calendar-value-color-active # selected day glyph
    affects: day
  - name: --ui-calendar-value-color-disabled # disabled AND adjacent-month days
    affects: day
  - name: --ui-calendar-value-font-variant-numeric # tabular-nums
    affects: day

  # ── footer band (the design's action row — the Footer tier) ──
  - name: --ui-footer-global-height
    affects: footer
  - name: --ui-footer-global-padding-x
    affects: footer
  - name: --ui-footer-global-gap
    affects: footer
  - name: --ui-footer-default-color
    affects: footer
  - name: --ui-footer-default-border-color
    affects: footer
  - name: --ui-footer-default-border-width
    affects: footer

  # ── focus ring (day + nav) ──
  - name: --ui-focus-primary
    affects: day
