spec_version: '1.0'
component: Drawer

# Framework-agnostic contract for a *composable* edge-anchored panel with
# swipe-to-dismiss: the overlay is assembled from parts (see anatomy.yaml). The
# root owns the open state and the `side` edge (which it maps to the underlying
# swipe direction). Property names are neutral; see `adapters` for per-framework
# syntax.
contract:
  properties:
    - name: open
      type: boolean
      required: false
      description: Controlled open state. Pair with the change event.
    - name: default-open
      type: boolean
      required: false
      default: false
      description: Initial open state when uncontrolled.
    - name: side
      type: "'top' | 'bottom' | 'left' | 'right'"
      required: false
      default: "'bottom'"
      description: >-
        Edge the panel anchors to and slides in from (on the root; shared with the
        content part for positioning). Top/bottom are full-width; left/right are
        full-height and anchor to a fixed physical edge. Mapped to the underlying
        primitive's swipe direction (bottom→down, top→up, left/right unchanged).
    - name: modal
      type: "boolean | 'trap-focus'"
      required: false
      default: true
      description: >-
        Modal behavior — traps focus and locks background scroll while open.
        `'trap-focus'` keeps the focus trap but allows background interaction.
    - name: disable-pointer-dismissal
      type: boolean
      required: false
      default: false
      description: >-
        Prevent the drawer from closing on an outside press (and, for non-modal
        drawers, when focus leaves it).
    - name: portal
      type: boolean
      required: false
      default: true
      description: >-
        Render the content inside a portal (the content part). Required by the
        underlying primitive for correct stacking; disable only when supplying
        your own portal ancestor.
    - name: render
      type: 'RenderProp'
      required: false
      default: undefined
      description: >-
        Composition prop available on the trigger, close, title, description, and
        other primitive parts — replaces the rendered element with another
        component (e.g. render the trigger as a Button) while merging props.
        React-only; other frameworks use their own polymorphism.

  events:
    - name: open-change
      payload: boolean
      description: >-
        Fired when the drawer opens or closes (React: `onOpenChange`). Payload is
        the new open value.

  content:
    - name: default
      description: >-
        The composed drawer. Author it from the parts: an optional trigger, plus
        the content (panel) wrapping an optional swipe-area handle, a header
        (title + close), a body (with a description), and an optional footer for
        actions.

  methods: []

adapters:
  react:
    component: Drawer
    status: implemented
    import: >-
      import { Drawer, DrawerTrigger, DrawerContent, DrawerHeader, DrawerTitle,
      DrawerCloseButton, DrawerBody, DrawerDescription, DrawerFooter,
      DrawerSwipeArea } from '@spec-lab/ui-react'
    example: |
      <Drawer side="bottom">
        <DrawerTrigger render={<Button variant="secondary">Open drawer</Button>} />
        <DrawerContent>
          <DrawerSwipeArea />
          <DrawerHeader>
            <DrawerTitle>Notifications</DrawerTitle>
            <DrawerCloseButton />
          </DrawerHeader>
          <DrawerBody>
            <DrawerDescription>You are all caught up.</DrawerDescription>
          </DrawerBody>
          <DrawerFooter>
            <DrawerClose render={<Button variant="ghost">Close</Button>} />
            <Button>Mark all read</Button>
          </DrawerFooter>
        </DrawerContent>
      </Drawer>

  vue:
    component: AvDrawer
    status: planned
    import: "import { AvDrawer } from '@spec-lab/ui-vue'"
    example: |
      <AvDrawer v-model:open="open" side="bottom" title="Notifications" />

  web-components:
    element: ui-drawer
    status: planned
    import: "import '@spec-lab/ui-wc/drawer'"
    example: |
      <ui-drawer open side="bottom">
        <ui-drawer-content>
          <ui-drawer-title>Notifications</ui-drawer-title>
        </ui-drawer-content>
      </ui-drawer>
