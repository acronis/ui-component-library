spec_version: '1.0'
component: RadialBarChart

# Framework-agnostic contract. RadialBarChart has NO cva variant axis — its
# expressiveness is geometry (angles + radii) and the data mapping, so there is
# nothing for the cva conformance check to compare. `data` / `config` / `dataKey`
# / `nameKey` are the data contract; the rest tune the sweep and chrome.
contract:
  properties:
    - name: data
      type: ReadonlyArray<Record<string, string | number>>
      required: true
      description: Row-per-arc data — each row holds a `nameKey` label and a `dataKey` numeric value.
    - name: config
      type: ChartConfig
      required: true
      description: >-
        Per-arc map of label / color, keyed by the arc's `nameKey` value (from
        the shared Chart primitives). Turned into `--color-<name>` custom
        properties. Colors are caller-supplied.
    - name: dataKey
      type: string
      required: true
      description: The numeric field that sizes each arc (its sweep length).
    - name: nameKey
      type: string
      required: true
      description: >-
        The label field that names each arc (drives legend, tooltip, and the
        `--color-<name>` lookup). Values should be unique per chart — arcs
        sharing a name share one config/color entry.
    - name: innerRadius
      type: number
      required: false
      default: '30'
      description: Inner radius of the innermost arc (0 packs arcs to the center).
    - name: outerRadius
      type: number
      required: false
      default: '110'
      description: Outer radius of the outermost arc.
    - name: startAngle
      type: number
      required: false
      default: '90'
      description: Sweep start angle in degrees. With endAngle, sets a full ring or a partial gauge.
    - name: endAngle
      type: number
      required: false
      default: '-270'
      description: Sweep end angle in degrees (default is a full 360° clockwise ring).
    - name: cornerRadius
      type: number
      required: false
      default: '4'
      description: Rounds the arc caps.
    - name: showBackground
      type: boolean
      required: false
      default: 'true'
      description: Draw the muted track behind each arc.
    - name: showTooltip
      type: boolean
      required: false
      default: 'true'
      description: Render the hover tooltip.
    - name: showLegend
      type: boolean
      required: false
      default: 'true'
      description: Render the legend of arc names.
    - name: tooltipContent
      type: 'ReactElement | ((props) => ReactNode)'
      required: false
      description: >-
        Replace the default tooltip. Pass a configured ChartTooltipContent (from
        this library) — e.g. with a formatter / labelFormatter — to customize the
        tooltip content without composing recharts. Ignored when showTooltip is
        false.
  events: []
  methods: []

adapters:
  react:
    component: RadialBarChart
    status: implemented
    import: "import { RadialBarChart } from '@constructor-lab/ui-react'"
    example: |
      <RadialBarChart
        config={config}
        data={data}
        dataKey="value"
        nameKey="browser"
        className="h-[360px] w-[360px]"
      />
  vue:
    component: AvRadialBarChart
    status: planned
    import: "import { AvRadialBarChart } from '@constructor-lab/ui-vue'"
    example: |
      <AvRadialBarChart :config="config" :data="data" data-key="value" name-key="browser" />
  web-components:
    element: ui-radial-bar-chart
    status: planned
    import: "import '@constructor-lab/ui-wc/radial-bar-chart'"
    example: |
      <ui-radial-bar-chart></ui-radial-bar-chart>
