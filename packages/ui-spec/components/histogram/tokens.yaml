spec_version: '1.0'
component: Histogram

# References only. Values live in @constructor-lab/tokens. Histogram has no token
# tier of its own — the count-series color is caller-supplied via `config`, bound
# to the theme-invariant `--ui-chart-*` data-viz palette. The axes, grid, and
# chrome (tooltip) resolve to the semantic tokens below.
source: '@constructor-lab/tokens'

tokens:
  - name: --ui-background-surface-primary
    affects: tooltip-content
    description: Tooltip surface (bg-background).
  - name: --ui-text-on-surface-primary
    affects: tooltip-content
    description: Tooltip value text and axis titles (text-foreground / .recharts-label fill).
  - name: --ui-text-on-surface-secondary
    affects: tooltip-content
    description: Muted tooltip label and axis-tick text (text-muted-foreground).
  - name: --ui-border-on-surface-border
    affects: tooltip-content
    description: Tooltip border and grid rules (border-border).
