spec_version: '1.0'
component: Treemap

# References only. Values live in @constructor-lab/tokens. Treemap has no token
# tier of its own — category colors are caller-supplied via `config`, bound to
# the theme-invariant `--ui-chart-*` data-viz palette. The gutter between tiles,
# the on-tile labels, and the chrome (tooltip) resolve to the semantic tokens
# below.
source: '@constructor-lab/tokens'

tokens:
  - name: --ui-background-surface-primary
    affects: tiles
    description: >-
      The gutter (stroke) between tiles and the tooltip surface (bg-background) —
      so tiles separate cleanly in light and dark.
  - name: --ui-text-on-brand-primary
    affects: label
    description: >-
      On-tile label text — the on-color text token (same light text a primary
      button uses), since labels sit on the theme-invariant category color.
  - name: --ui-text-on-surface-primary
    affects: tooltip-content
    description: Tooltip value text (text-foreground).
  - name: --ui-text-on-surface-secondary
    affects: tooltip-content
    description: Muted tooltip label text (text-muted-foreground).
  - name: --ui-border-on-surface-border
    affects: tooltip-content
    description: Tooltip border (border-border).
