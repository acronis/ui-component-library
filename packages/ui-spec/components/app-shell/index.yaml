spec_version: '1.0'
component: AppShell
name: app-shell
status: ready
category: layout
layer: composite
description: >-
  The full-page application scaffold — a sidebar column (primary nav, optionally one
  or two secondary menus) beside a body column of a sticky header (page title /
  breadcrumbs + actions) over the scrolling main content, and an optional right-hand
  AI/chat panel. A slot-based layout: drop SidebarPrimary / SidebarSecondary, a page
  header, the chat panel, and your page content into its slots.
