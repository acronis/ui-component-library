spec_version: '1.0'
component: PieChart

# References only. Values live in @constructor-lab/tokens. PieChart has no token
# tier of its own — slice colors are caller-supplied via `config`, bound to the
# theme-invariant `--ui-chart-*` data-viz palette. The chrome (tooltip, legend)
# and the donut center label are inherited from / themed by the shared Chart
# primitives and the semantic tokens below.
source: '@constructor-lab/tokens'

tokens:
  - name: --ui-background-surface-primary
    affects: tooltip-content
    description: Tooltip surface (bg-background).
  - name: --ui-text-on-surface-primary
    affects: tooltip-content
    description: Tooltip value text and the donut center value (text-foreground / fill-foreground).
  - name: --ui-text-on-surface-secondary
    affects: legend-content
    description: >-
      Muted tooltip/legend label text and the donut center caption
      (text-muted-foreground / fill-muted-foreground).
  - name: --ui-border-on-surface-border
    affects: tooltip-content
    description: Tooltip border (border-border).
