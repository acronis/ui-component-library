spec_version: '1.0'
component: DataGrid
name: data-grid
status: draft
category: data-display
layer: composite
description: >-
  The sole batteries-included table composite. It normalizes its simple grouped
  config into one DataTable controller, then exclusively composes standard
  toolbar/search/filter, selection, column settings, data states, actions,
  menus/overlays, expansion/group controls, tooltips, live regions and
  pagination from existing UIKit primitives. DataTable remains its headless
  engine and Table its semantic presentation base; no parallel public
  DataTable companion-chrome suite is part of the target architecture.
since: 2.1.0
dependencies:
  components:
    - Table
    - DataTable
    - Toolbar
    - Checkbox
    - Button
    - ButtonIcon
    - ButtonGroup
    - InputSearch
    - InputText
    - InputSelect
    - Select
    - Combobox
    - Chip
    - Popover
    - Tooltip
    - Menu
    - Dialog
    - Empty
    - Alert
    - Skeleton
    - Spinner
    - Collapsible
    - Pagination
    - ScrollArea
