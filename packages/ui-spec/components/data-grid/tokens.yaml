spec_version: '1.0'
component: DataGrid

# References only. Values live in @constructor-lab/tokens. DataGrid adds no color
# of its own — it composes already-themed components (Table, Checkbox,
# DataTableToolbar, DataTablePagination), each carrying its own tier. DataGrid's
# own chrome reuses the Table component's `--ui-table-*` tier so the wrapper
# border matches the cell borders and the empty state matches muted table text.
source: '@constructor-lab/tokens'

tokens:
  - name: --ui-table-global-row-border-color
    affects: table
    description: Wrapper border — matches the Table cell borders.
  - name: --ui-table-data-value-color-disabled
    affects: empty-state
    description: Muted empty-message text — matches disabled table values.
  - name: --ui-background-surface-secondary
    affects: row
    description: Striped row background + skeleton placeholder bars.
