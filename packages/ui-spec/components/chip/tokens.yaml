spec_version: '1.0'
component: Chip

# References only. Values live in @spec-lab/tokens (generated from Figma) and
# resolve per brand/theme at paint time. Chip binds the dedicated `--ui-chip-*`
# tier: shared `_global` geometry + idle/hover/active container fill & border
# colors + icon, and a per-variant label color
# (`--ui-chip-<operational|selectable|removable>-label-color`). The focus ring
# reuses the shared `--ui-focus-primary`.
source: '@spec-lab/tokens'

tokens:
  # ── Geometry (root) ──
  - name: --ui-chip-global-box-height
    affects: root
  - name: --ui-chip-global-box-gap
    affects: root
  - name: --ui-chip-global-box-padding-x
    affects: root
  - name: --ui-chip-global-box-width-min
    affects: root
  - name: --ui-chip-global-border-radius
    affects: root
  - name: --ui-chip-global-border-width
    affects: root

  # ── Container fill (idle / hover / active) ──
  - name: --ui-chip-global-box-color-idle
    affects: root
  - name: --ui-chip-global-box-color-hover
    affects: root
  - name: --ui-chip-global-box-color-active
    affects: root

  # ── Border color (idle / hover / active) ──
  - name: --ui-chip-global-border-color-idle
    affects: root
  - name: --ui-chip-global-border-color-hover
    affects: root
  - name: --ui-chip-global-border-color-active
    affects: root

  # ── Label color (per variant) ──
  - name: --ui-chip-operational-label-color
    affects: label
  - name: --ui-chip-selectable-label-color
    affects: label
  - name: --ui-chip-removable-label-color
    affects: label

  # ── Icon (leading icon + remove glyph) ──
  - name: --ui-chip-global-icon-color
    affects: icon
  - name: --ui-chip-global-icon-size
    affects: icon

  # ── Focus ring (shared) ──
  - name: --ui-focus-primary
    affects: root
