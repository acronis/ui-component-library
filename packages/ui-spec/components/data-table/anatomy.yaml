spec_version: '1.0'
component: DataTable

schematic: |
  root: DataTableRoot (one shared controller)
    view: DataTableView projects engine models through Table
      table: semantic Table primitive
      header-context: header state, commands, metadata, render values
      row-context: row state, commands, metadata, render values
      cell-context: cell state, commands, metadata, render values
      detail-context: detail-expanded state and projection context
      tree-context: tree/lazy state and projection context
      group-context: grouped-root state and projection context
      footer-context: summary model and projection context
      state-context: loading/empty/error/append metadata and action intents

root:
  element: div
  description: >-
    DataTableRoot provides one controller. DataTableView projects its models
    through the semantic Table primitive. Render contexts expose state,
    commands, metadata and values; they never contain preassembled UIKit
    controls or batteries-included product chrome. During the first controller
    minor only, the deprecated React convenience projection preserves
    skeleton/skeletonRows, striped, bordered and highlightCurrentRow exactly;
    its skeleton path reuses UIKit Skeleton as the sole temporary exception.

parts:
  - id: view
    element: div
    description: Headless-to-Table projection owned by DataTableView.
  - id: table
    element: table
    description: Semantic Table projection for engine headers, rows and cells.
  - id: header-context
    description: Sort/filter/column metadata and commands for a caller renderer.
  - id: row-context
    description: Selection/current/action metadata and commands for a caller renderer.
  - id: cell-context
    description: Cell value, events, tooltip metadata and render commands.
  - id: detail-context
    description: Independent detail-expanded metadata, commands and projection content.
    optional: true
  - id: tree-context
    description: Independent tree-expanded/lazy metadata, commands and child projection.
    optional: true
  - id: group-context
    description: Grouped-root metadata, commands and aggregate projection.
    optional: true
  - id: footer-context
    description: Summary model and footer render context; no formatted standard UI.
    optional: true
  - id: state-context
    description: >-
      Loading/loaded/empty/error/append metadata and action intents. DataGrid or
      an application renderer chooses Skeleton, Empty, Alert, retry and live-region UI.
    optional: true

states:
  - id: detail-model
    trigger: detailExpansion is enabled
    kind: prop
    prop: detailExpansion
    affects: [detail-context, row-context]
  - id: tree-model
    trigger: tree is enabled
    kind: prop
    prop: tree
    affects: [tree-context, row-context]
  - id: grouped-model
    trigger: grouping is enabled
    kind: prop
    prop: grouping
    affects: [group-context, row-context]
  - id: data-state-model
    trigger: dataState metadata is supplied
    kind: prop
    prop: dataState
    affects: [state-context]
  - id: virtual-model
    trigger: virtualization is enabled
    kind: prop
    prop: virtualization
    affects: [view, row-context]
