spec_version: '1.0'
component: DropdownMenu

# References only. Values live in @constructor-lab/tokens (generated from
# @constructor-lab/tokens) and resolve per brand/theme at paint time.
# DropdownMenu is an alias of `Menu` (see components/menu), so it renders from
# the shared `--ui-button-menu-dropdown-*` token tier that `Menu` is styled from.
source: '@constructor-lab/tokens'

tokens:
  - {
      name: --ui-button-menu-dropdown-container-color,
      affects: root,
      description: Popup surface,
    }
  - {
      name: --ui-button-menu-dropdown-container-border-color,
      affects: root,
      description: Popup border,
    }
  - {
      name: --ui-button-menu-dropdown-container-border-radius,
      affects: root,
      description: Popup corner radius,
    }
  - {
      name: --ui-button-menu-dropdown-item-label-color,
      affects: item,
      description: Item + label text color,
    }
  - {
      name: --ui-button-menu-dropdown-item-container-color-idle,
      affects: item,
      description: Idle item background,
    }
  - {
      name: --ui-button-menu-dropdown-item-container-color-hover,
      affects: item,
      description: Highlighted item background (pointer or keyboard),
    }
  - {
      name: --ui-button-menu-dropdown-item-container-color-active,
      affects: item,
      description: Pressed item background,
    }
  - {
      name: --ui-button-menu-dropdown-item-icon-color,
      affects: item,
      description: Leading icon + checkbox/radio indicator color,
    }
  - {
      name: --ui-button-menu-dropdown-section-container-border-color,
      affects: separator,
      description: Separator / section divider color,
    }
  - {
      name: --ui-button-menu-dropdown-extras-shortcut-label-color,
      affects: shortcut,
      description: Shortcut hint color,
    }
  - {
      name: --ui-button-menu-dropdown-extras-cascade-icon-color,
      affects: submenu-trigger,
      description: Submenu / cascade chevron color,
    }
