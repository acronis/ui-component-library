spec_version: '1.0'
component: LineChart

# References only. Values live in @constructor-lab/tokens. LineChart has no token
# tier of its own — series colors are caller-supplied via `config`, bound to the
# theme-invariant `--ui-chart-*` data-viz palette. The chrome (tooltip, legend,
# axes, grid) is inherited from the shared Chart primitives, which resolve the
# semantic tokens below.
source: '@constructor-lab/tokens'

tokens:
  - name: --ui-background-surface-primary
    affects: tooltip-content
    description: Tooltip surface (bg-background).
  - name: --ui-text-on-surface-primary
    affects: tooltip-content
    description: Tooltip value text and axis titles (text-foreground / fill-foreground).
  - name: --ui-text-on-surface-secondary
    affects: x-axis
    description: >-
      Muted tooltip/legend label text and axis tick labels
      (text-muted-foreground / fill-muted-foreground).
  - name: --ui-border-on-surface-border
    affects: grid
    description: >-
      Tooltip border and the recharts grid / cursor lines
      (border-border / stroke-border).
  - name: --ui-background-surface-secondary
    affects: series
    description: Recharts muted fills — tooltip cursor line behind a hovered point (fill-muted).
