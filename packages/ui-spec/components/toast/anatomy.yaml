spec_version: '1.0'
component: Toast

schematic: |
  root: <div role="region" aria-label="Notifications"> fixed bottom-right stack
    toast: <div> card (strong status border, white surface, shadow), one per notification
      toast-accent: 6px left bar in the strong status color (status types only)
      icon:        leading full-color status glyph (success/info/warning/error) or spinner
      title:       bold first line
      description: secondary line
      action:      optional inline button (e.g. Undo)
      close:       trailing compact dismiss (✕) button

root:
  element: div
  role: region
  description: >-
    The toast viewport — a live region (`aria-label="Notifications"`,
    `aria-live="polite"`) that portals to the bottom-right of the page and
    renders the queued toasts as a vertical stack. Rendered once via `<Toaster>`.

parts:
  - id: toast
    element: div
    description: >-
      A single notification card — white surface, strong status border, floating
      shadow (`loading`/untyped stay neutral with a plain border).
  - id: toast-accent
    element: span
    description: >-
      The 6px left bar in the strong status background
      (--ui-background-status-strong-*), shown for the colored status types;
      decorative (aria-hidden).
  - id: icon
    element: span
    description: >-
      Leading full-color status glyph — CircleCheckGreen (success), CircleInfoBlue
      (info), TriangleWarningYellow (warning), DiamondWarningRed (error); a Spinner
      for the loading type.
  - id: title
    element: div
    description: The bold first line.
  - id: description
    element: div
    description: Optional secondary line (foreground text).
  - id: action
    element: button
    description: Optional inline action button (e.g. Undo).
  - id: close
    element: button
    description: Trailing dismiss (✕) button.

# A toast's `type` (default / success / info / warning / error / loading) and its
# enter/auto-dismiss/exit lifecycle are runtime facets of the imperative API, not
# props on a rendered component — see behavior.md.
states: []
