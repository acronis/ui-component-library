spec_version: '1.0'
component: Toast

schematic: |
  root: <div role="region" aria-label="Notifications"> fixed bottom-right stack
    toast: <div> card (strong status border, white surface, shadow) — itself the padded
           icon · content · close row, one per notification
      icon:        leading full-color status glyph (info/success/warning/critical/error) or spinner
      content:     the column holding the text block and the actions row
        title:       first line, `headings/body-heading` (16/500)
        description: secondary line, the tier's description text style
        action:      optional inline button (e.g. Undo) — aligned with the text, not the icon
      close:       trailing compact dismiss (✕) button
      toast-accent: status bar overlaying the card's leading edge, `container/statusWidth`
                    wide (status types only)

root:
  element: div
  role: region
  description: >-
    The toast viewport — a live region (`aria-label="Notifications"`,
    `aria-live="polite"`) that portals to the bottom-right of the page and
    renders the queued toasts as a vertical stack. Rendered once via `<Toaster>`.

parts:
  - id: toast
    element: div
    description: >-
      A single notification card — white surface, strong status border, floating
      shadow (`loading`/untyped stay neutral with a plain border).
  - id: toast-accent
    element: span
    description: >-
      The status bar — `--ui-toast-global-container-status-width` wide, filled with
      the status's `--ui-toast-<status>-left-line`. Positioned over the card's
      leading edge (it takes no layout width, so the text keeps the container's
      `paddingX` from the card edge) and spans its full height. Shown for the
      colored status types only; decorative (aria-hidden).
  - id: icon
    element: span
    description: >-
      Leading full-color status glyph — CircleCheckGreen (success), CircleInfoBlue
      (info), TriangleWarningYellow (warning), CircleWarningOrange (critical),
      DiamondWarningRed (error); a Spinner for the loading type.
  - id: content
    element: div
    description: >-
      The content column. It holds the text block (title + description, carrying
      the tier's `content/textContainer` gap and padding) and, below it, the actions
      row — so an action lines up with the text rather than with the icon.
  - id: title
    element: div
    description: >-
      The first line, in the tier's own bound text style
      (`.ui-toast-global-content-text-container-title-text-style`, which aliases
      `typography.headings.lead`).
  - id: description
    element: div
    description: Optional secondary line (foreground text).
  - id: action
    element: button
    description: >-
      Optional inline action — a `Button` with the design's `ghost` variant, so it
      carries that tier's label colours and 32px height rather than restating
      them.
  - id: close
    element: button
    description: >-
      Trailing dismiss control — a `ButtonIcon` with the design's `ghost` variant
      (the design makes it an instance of that component), holding the `TimesSmall`
      glyph.

# A toast's `type` (default / success / info / warning / error / loading) and its
# enter/auto-dismiss/exit lifecycle are runtime facets of the imperative API, not
# props on a rendered component — see behavior.md.
# The status types are DATA (the `type` passed to `toast(...)`), not prop-states of
# a rendered element, so they are not listed here — see api.yaml + behavior.md.
# The design's five statuses are info / success / warning / critical / danger; this
# component names the last one `error`.
states: []
