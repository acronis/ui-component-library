spec_version: '1.0'
component: Toast

# References only. Values live in @constructor-lab/tokens and resolve per
# brand/theme at paint time. The token schema forbids a value/default key here.
#
# Toast binds its OWN `--ui-toast-*` tier (Figma node 7421:126262 — the set the
# design calls "Toast"/"Notification"). It previously described the shared
# semantic status vocabulary instead, so the generated tier went unconsumed and a
# brand re-pointing a `--ui-toast-*` value changed nothing.
#
# Two design values are deliberately NOT bound, because the tier holds something
# that is not a CSS value: `--ui-toast-global-container-shadow-shadow` is the
# string `shadowRegular` (a Figma effect-style name), so the card keeps a Tailwind
# shadow utility; and the per-status icons are Figma asset instances, supplied
# from `@constructor-lab/icons-react/stroke-multi` by name.
#
# The tier's title typography token is also unbound, for a different reason: it
# aliases `typography.body.strong` (14/600), but the design node's title text
# applies `headings/body-heading` (16/500). The node is what the component
# reproduces (`.ui-typography-headings-heading`); the tier variable is the
# Figma-side value to correct. The description's tier text style agrees with the
# node (`body/default`), so it IS bound.
source: '@constructor-lab/tokens'

tokens:
  # ── card ──
  - name: --ui-toast-global-container-color-background
    affects: toast
    description: Card surface.
  - name: --ui-toast-global-container-border-width
    affects: toast
    description: Card border width; its color is the per-status `border-color`.
  - name: --ui-toast-global-container-border-radius
    affects: toast
    description: Card corner radius.
  - name: --ui-toast-global-container-width-min
    affects: toast
    description: Minimum card width; also the viewport column width.
  - name: --ui-toast-global-container-padding-x
    affects: content
    description: Inset of the card content, right of the status bar.
  - name: --ui-toast-global-container-padding-y
    affects: content
    description: Vertical inset of the card content.
  - name: --ui-toast-global-container-gap
    affects: content
    description: Gap between the status icon, the text block and the close button.

  # ── status bar + per-status colors ──
  - name: --ui-toast-global-container-status-width
    affects: toast-accent
    description: Width of the full-height status bar.
  - name: --ui-toast-info-left-line
    affects: toast-accent
  - name: --ui-toast-info-border-color
    affects: toast
  - name: --ui-toast-success-left-line
    affects: toast-accent
  - name: --ui-toast-success-border-color
    affects: toast
  - name: --ui-toast-warning-left-line
    affects: toast-accent
  - name: --ui-toast-warning-border-color
    affects: toast
  - name: --ui-toast-critical-left-line
    affects: toast-accent
  - name: --ui-toast-critical-border-color
    affects: toast
  # The design's `danger` status is this component's `error` type.
  - name: --ui-toast-danger-left-line
    affects: toast-accent
  - name: --ui-toast-danger-border-color
    affects: toast

  # ── status icon box ──
  - name: --ui-toast-global-icon-size
    affects: icon
  - name: --ui-toast-global-icon-padding-x
    affects: icon
  - name: --ui-toast-global-icon-padding-y
    affects: icon

  # ── content container (title + description) ──
  - name: --ui-toast-global-content-container-gap
    affects: content
  - name: --ui-toast-global-content-container-padding-x
    affects: content
  - name: --ui-toast-global-content-container-padding-y
    affects: content
  - name: --ui-toast-global-content-container-title-color
    affects: title
  - name: --ui-toast-global-content-container-description-color
    affects: description

  # ── actions row ──
  - name: --ui-toast-global-actions-gap-x
    affects: action
  - name: --ui-toast-global-actions-gap-y
    affects: action
  - name: --ui-toast-global-actions-padding-x
    affects: action
  - name: --ui-toast-global-actions-padding-y
    affects: action

  # ── close button + action ──
  # Both are instances of a shipped component in the design, so Toast composes
  # `ButtonIcon variant="ghost"` / `Button variant="ghost"` and those components
  # own their tiers (container box + glyph colour per state; label colour, height
  # and padding per state). Listed here as the tokens that reach a Toast part, not
  # as tokens Toast itself references — see ../button-icon/tokens.yaml and
  # ../button/tokens.yaml for the full per-state sets.
  - name: --ui-button-icon-global-container-height
    affects: close
    description: Dismiss box, via ButtonIcon.
  - name: --ui-button-icon-global-container-border-radius
    affects: close
    description: Dismiss corner radius, via ButtonIcon.
  - name: --ui-button-icon-global-container-color-idle
    affects: close
    description: Dismiss fill, via ButtonIcon (hover/active/disabled likewise).
  - name: --ui-button-icon-global-icon-color-idle
    affects: close
    description: Dismiss glyph colour, via ButtonIcon (per state likewise).
  - name: --ui-button-icon-global-icon-size
    affects: close
    description: Dismiss glyph size, via ButtonIcon.
  - name: --ui-button-ghost-label-color-idle
    affects: action
    description: Action label, via Button's ghost variant (per state likewise).
  - name: --ui-button-ghost-container-padding-x
    affects: action
    description: Action horizontal padding, via Button's ghost variant.
  - name: --ui-button-global-container-height
    affects: action
    description: Action height, via Button.

  # ── focus ──
  - name: --ui-focus-primary
    affects: close
    description: Focus ring on either control, via its component.
