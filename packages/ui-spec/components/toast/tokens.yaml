spec_version: '1.0'
component: Toast

# References only. Values live in @constructor-lab/tokens. Reconciled with the
# redesigned Figma "Notification" set (node 6946-25164), sharing the redesigned
# Alert's language: a white surface (--ui-background-surface-primary, bridged
# bg-background) with a STRONG status border (--ui-border-on-status-*-strong), a
# 6px left accent bar in the strong status background
# (--ui-background-status-strong-*), a variant-driven full-color status icon (no
# token — it carries its own colors), and a floating drop shadow. The compact
# close uses the neutral glyph (text-muted-foreground → text-foreground on hover)
# over the surface-hover background. `loading` / untyped toasts stay neutral
# (border-border, no accent).
source: '@constructor-lab/tokens'

tokens:
  - name: --ui-background-surface-primary
    affects: toast
    description: Toast card background (bridged as `bg-background`).
  - name: --ui-border-on-surface-border
    affects: toast
    description: Neutral (loading / untyped) card border (bridged as `border-border`).
  - name: --ui-text-on-surface-primary
    affects: title
    description: Title + description text (bridged as `text-foreground`).
  - name: --ui-text-on-surface-secondary
    affects: close
    description: Idle close-glyph color (bridged as `text-muted-foreground`).
  - name: --ui-background-surface-hover
    affects: close
    description: Close-button hover surface (bridged as `bg-accent`).
  - name: --ui-background-brand-secondary
    affects: action
    description: Action-button label, the brand action blue (bridged as `text-secondary`).
  - name: --ui-focus-primary
    affects: close
    description: Close-button keyboard focus ring.

  # ── border (strong) + accent bar (strong bg), per status type ──
  - name: --ui-border-on-status-success-strong
    affects: toast
  - name: --ui-background-status-strong-success
    affects: toast-accent
  - name: --ui-border-on-status-info-strong
    affects: toast
  - name: --ui-background-status-strong-info
    affects: toast-accent
  - name: --ui-border-on-status-warning-strong
    affects: toast
  - name: --ui-background-status-strong-warning
    affects: toast-accent
  - name: --ui-border-on-status-danger-strong
    affects: toast
  - name: --ui-background-status-strong-danger
    affects: toast-accent
