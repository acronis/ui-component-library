spec_version: '1.0'
component: FunnelChart
name: funnel-chart
status: draft
category: data-display
layer: primitive
description: >-
  A typed funnel-chart composition over the shared `Chart` primitives. Plots a
  `data` list of stages (each sized by `dataKey`, named by `nameKey`) as a
  narrowing funnel inside a `ChartContainer`, with tooltip and on-chart labels.
  One variant axis: `lastShape` (narrow to a `triangle` point or end flat as a
  `rectangle`); `reversed` flips the taper. Stage colors bind to the
  theme-invariant `--ui-chart-*` palette.
since: 2.4.0
