spec_version: '1.0'
component: FunnelChart

# References only. Values live in @constructor-lab/tokens. FunnelChart has no
# token tier of its own — stage colors are caller-supplied via `config`, bound to
# the theme-invariant `--ui-chart-*` data-viz palette. The chrome (tooltip) and
# on-chart labels are inherited from / themed by the shared Chart primitives and
# the semantic tokens below.
source: '@constructor-lab/tokens'

tokens:
  - name: --ui-background-surface-primary
    affects: tooltip-content
    description: Tooltip surface (bg-background).
  - name: --ui-text-on-surface-primary
    affects: labels
    description: Tooltip value text and the on-chart stage labels (text-foreground / fill-foreground).
  - name: --ui-text-on-surface-secondary
    affects: tooltip-content
    description: Muted tooltip label text (text-muted-foreground).
  - name: --ui-border-on-surface-border
    affects: tooltip-content
    description: Tooltip border (border-border).
