spec_version: '1.0'
pattern: DataTableBulkActions
name: data-table-bulk-actions
status: draft
category: data-display
since: 0.42.0
intent: Select rows in a data table and act on the selection via a contextual bulk-action bar.
description: >-
  The sanctioned way to offer row selection with bulk actions (delete, export,
  …): a checkbox selection column drives a contextual bar that replaces the
  toolbar while rows are selected, showing the count and the available actions.
  The default path is DataGrid `selection` + `toolbar.bulkActions`, and it is
  shipped — prefer it. When custom composition is required, one `useDataTable`
  controller feeds DataTableRoot, toolbar/bulk actions, view, and pagination.
  Never combine the self-contained DataTable with a second caller-created
  instance.

when_to_use:
  - A table where users pick several rows and apply one action to all of them.
  - Destructive or batch operations (delete, export, assign) on multiple rows.
when_not_to_use:
  - A read-only standard records table — use the `table-view` DataGrid recipe.
  - One action per row — put a row action (menu / button) in a cell instead.

anti_patterns:
  - Using the self-contained DataTable and a separate table instance for the bar.
  - Leaving the bulk bar always visible — show it only while rows are selected.
  - Hiding the selection count — always show "N selected" so the scope is clear.

components:
  - Checkbox
  - Button
  - Toolbar
  - InputSearch
  - Pagination
  - DataTable
  - DataGrid

demo: apps/demos/src/patterns/DataTableBulkActionsDemo.tsx
docs: apps/docs/content/docs/patterns/data-table-bulk-actions.mdx

# Shipped. Prefer DataGrid when its bulk-action config suffices; the custom
# branch still uses exactly one DataTable controller. Bulk actions require
# multiple selection, and a `confirm` routes the action through ConfirmDialog.
example: |
  <DataGrid
    columns={columns}
    rows={rows}
    getRowId={(row) => row.id}
    selection={{
      mode: 'multiple',
      isRowSelectable: (row) => !row.locked,
    }}
    toolbar={{
      bulkActions: [
        { id: 'export', label: 'Export', onAction: exportRows },
        {
          id: 'delete',
          label: 'Delete',
          destructive: true,
          confirm: { title: 'Delete selected records?', confirmLabel: 'Delete' },
          onAction: deleteRows,
        },
      ],
    }}
    pagination={{ pageSize: 25, pageSizeOptions: [25, 50] }}
    callbacks={{ onSelectionChange: (event) => setSelected(event.value) }}
  />

  // Custom composition:
  const table = useDataTable({
    columns,
    data: rows,
    getRowId,
    selection: {},
    defaultState: { pagination: { pageIndex: 0, pageSize: 25 } },
    pagination: { pageSizeOptions: [25, 50] },
  });
  <DataTableRoot table={table}>
    <Toolbar>
      {table.getSelectedRowModel().rows.length > 0 ? (
        <CustomBulkBar table={table} />
      ) : (
        <InputSearch value={table.getState().globalFilter} onChange={table.actions.setGlobalFilter} />
      )}
    </Toolbar>
    <DataTableView renderHeader={renderHeader} renderCell={renderCell} />
    <Pagination
      page={table.getState().pagination.pageIndex + 1}
      onPageChange={table.actions.setPage}
    />
  </DataTableRoot>
