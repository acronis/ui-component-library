spec_version: '1.0'
pattern: FormDialog
name: form-dialog
status: draft
category: overlays
since: 1.0.0
intent: A short create/edit form inside a modal Dialog, with a titled header and a cancel / submit footer.
description: >-
  The sanctioned way to capture a short create/edit form without leaving the
  page: a `Dialog` whose body holds a `Form` of `Field` + `InputText` controls,
  a header naming the task, and a footer with a ghost cancel and a primary
  submit. `Form` owns validation and error wiring; each `Field` binds a control
  to its label and error slot. Keep it to a handful of fields — the modal is for
  a quick, focused entry, not a whole page of inputs.

when_to_use:
  - Creating or editing a small record (a few fields) without a full-page route.
  - A focused entry task the user should finish or cancel before continuing.
  - Reusing one form for both create and edit by seeding default values.
when_not_to_use:
  - More than a single step — use `wizard-dialog`.
  - A whole page of fields or complex layout — use a dedicated route, not a dialog.
  - A yes/no or destructive confirmation with no input — use `confirm-dialog`.

anti_patterns:
  - Wiring validation and error messages by hand instead of using `Form` + `Field`.
  - Submitting on backdrop click or losing entered data when the dialog closes — confirm or preserve the draft.
  - Overfilling the modal so it scrolls endlessly — if it needs that many fields, it's a page.
  - Omitting `DialogTitle`, leaving the dialog without an accessible name.

components:
  - Dialog
  - Form
  - Field
  - InputText
  - Button

demo: apps/demos/src/patterns/FormDialogDemo.tsx
docs: apps/docs/content/docs/patterns/form-dialog.mdx

# Approved starting point. Title in the header, a Form of Field + InputText in
# the body, cancel + submit in the footer.
example: |
  function CreateProjectDialog({ open, onOpenChange, onSubmit }) {
    return (
      <Dialog open={open} onOpenChange={onOpenChange}>
        <DialogContent>
          <DialogHeader>
            <DialogTitle>New project</DialogTitle>
            <DialogCloseButton />
          </DialogHeader>
          <Form onFormSubmit={onSubmit}>
            <DialogBody className="flex flex-col gap-4">
              <Field name="name">
                <FieldLabel>Name</FieldLabel>
                <FieldControl render={<InputText placeholder="Acme migration" required />} />
                <FieldError />
              </Field>
              <Field name="key">
                <FieldLabel>Key</FieldLabel>
                <FieldControl render={<InputText placeholder="ACME" />} />
                <FieldDescription>A short identifier used in URLs.</FieldDescription>
              </Field>
            </DialogBody>
            <DialogFooter>
              <DialogClose render={<Button variant="ghost">Cancel</Button>} />
              <Button type="submit">Create</Button>
            </DialogFooter>
          </Form>
        </DialogContent>
      </Dialog>
    );
  }
