spec_version: '1.0'
pattern: CardGrid
name: card-grid
status: draft
category: layout
since: 1.0.0
intent: A responsive grid of uniform cards (catalog / gallery / overview tiles) under a page header.
description: >-
  The sanctioned layout for a set of peer items shown as tiles: a `PageHeader`
  over a responsive `Grid` of uniform `Card`s. `Grid`'s `cols` variant handles
  the responsive column counts, so every tile aligns and reflows consistently
  without ad-hoc CSS grid. Use it for catalogs, galleries, product/plan pickers,
  and overview tiles — anywhere the items are homogeneous cards rather than
  tabular rows.

when_to_use:
  - A collection of peer items best shown as uniform cards (catalog, gallery, plan picker).
  - Content that should reflow responsively from one column to several.
  - An overview page where each tile links into a detail view.
when_not_to_use:
  - Tabular records with columns to sort/filter/paginate — use `table-view`.
  - A widget dashboard of heterogeneous, differently-sized panels — use the `dashboard` pattern (including its container-query grid inside the AppShell main region).
  - A single prominent item — a lone `Card` needs no grid.

anti_patterns:
  - Rolling a bespoke CSS grid instead of composing `Grid` (loses the kit's responsive column tiers and gap tokens).
  - Mixing wildly different card heights/contents so the grid reads as a broken table — keep tiles uniform.
  - Cramming dashboard widgets into a uniform card grid — heterogeneous panels belong in `dashboard`.
  - Omitting the `PageHeader`, leaving the grid without a title or context.

components:
  - PageHeader
  - Grid
  - Card

demo: apps/demos/src/patterns/CardGridDemo.tsx

# Approved starting point. A PageHeader over a responsive Grid of uniform Cards;
# let Grid's cols variant drive the columns.
example: |
  function CatalogGrid({ items }) {
    return (
      <div className="flex flex-col gap-6">
        <PageHeader>
          <PageHeaderRow>
            <PageHeaderTitle>Integrations</PageHeaderTitle>
          </PageHeaderRow>
          <PageHeaderDescription>Connect the tools your team already uses.</PageHeaderDescription>
        </PageHeader>
        <Grid cols={3} gap="md">
          {items.map((item) => (
            <Card key={item.id}>
              <CardHeader>
                <CardTitle>{item.name}</CardTitle>
                <CardDescription>{item.summary}</CardDescription>
              </CardHeader>
              <CardFooter>
                <Button variant="secondary">Connect</Button>
              </CardFooter>
            </Card>
          ))}
        </Grid>
      </div>
    );
  }
