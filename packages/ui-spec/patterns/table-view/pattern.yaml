spec_version: '1.0'
pattern: TableView
name: table-view
status: draft
category: layout
since: 1.0.0
intent: A full records screen — a page header and a DataGrid with approved search, filters, sorting, and pagination.
description: >-
  The sanctioned shape for a records screen: a `PageHeader` (title + primary
  action) and a `DataGrid` whose grouped filters/toolbar/pagination configs own
  the standard records experience through one DataTable controller. This is the
  canonical "list of things" layout. The grouped DataGrid API is shipped — use it
  directly; the example below uses only members that exist today. Discrete
  (faceted) column filter options and an initial sort via `defaultState` are still
  P1, so a screen needing either keeps its own filter composition for now. For
  uncommon composition or selectively manual processing, use one DataTable
  controller. For contextual selection, follow `data-table-bulk-actions`.

when_to_use:
  - A primary screen listing records the user browses, searches, filters, and paginates.
  - A table that needs global search plus typed discrete column filters.
  - Any place the app shows "all the Xs" as the main content of a route.
when_not_to_use:
  - Uncommon layout or selective manual processing — compose one DataTable controller.
  - A small, fixed set of rows with no search/filter/pagination — a plain `Table` is enough.
  - Card-based catalog/gallery tiles rather than tabular rows — use `card-grid`.

anti_patterns:
  - Reimplementing sorting, filtering, or pagination outside DataGrid/DataTable.
  - Treating a global text search as a substitute for typed status/type filters.
  - Omitting the `PageHeader` so the screen has no title or home for its primary action.
  - Placing per-row selection checkboxes here without the bulk-action bar — if you need selection, adopt `data-table-bulk-actions`.

components:
  - PageHeader
  - DataGrid
  - Button

demo: apps/demos/src/patterns/TableViewDemo.tsx
docs: apps/docs/content/docs/patterns/table-view.mdx

# Shipped. DataGrid owns the approved toolbar and normalizes every feature into
# one DataTable controller. Every prop below exists in the React adapter today;
# `callbacks` carries the named screen events.
example: |
  function DevicesView({ columns, rows, query, rowCount, dataState, onQueryChange, onCreate }) {
    return (
      <div className="flex flex-col gap-4">
        <PageHeader>
          <PageHeaderRow>
            <PageHeaderTitle>Devices</PageHeaderTitle>
            <PageHeaderActions>
              <Button onClick={onCreate}>Add device</Button>
            </PageHeaderActions>
          </PageHeaderRow>
        </PageHeader>
        <DataGrid
          columns={columns}
          rows={rows}
          getRowId={(row) => row.id}
          dataState={dataState}
          filters={{
            global: { columnId: 'name', placeholder: 'Search devices…' },
            columns: deviceFilterDefinitions,
          }}
          sorting={{ mode: 'single' }}
          pagination={{ pageSize: 25, pageSizeOptions: [25, 50, 100] }}
          toolbar={{ globalSearch: true }}
          server={{ query, rowCount, onQueryChange }}
          callbacks={{ onQueryChange: syncUrl, onColumnStateChange: persist }}
        />
      </div>
    );
  }
