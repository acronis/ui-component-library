spec_version: '1.0'
pattern: TableView
name: table-view
status: draft
category: layout
since: 1.0.0
intent: A full list/table screen — a page header, a search + filter toolbar, and a paginated DataTable of records.
description: >-
  The sanctioned shape for a records screen: a `PageHeader` (title + primary
  action), a toolbar pairing an `InputSearch` for free-text with `Filter`
  triggers for discrete criteria, and a `DataTable` rendering the rows with its
  built-in `DataTablePagination`. This is the canonical "list of things" layout —
  compose it rather than assembling a bespoke table page. For row selection with
  a contextual action bar, see `data-table-bulk-actions`, which layers selection
  onto this same table.

when_to_use:
  - A primary screen listing records the user browses, searches, filters, and paginates.
  - A table that needs both free-text search (InputSearch) and discrete filters (Filter).
  - Any place the app shows "all the Xs" as the main content of a route.
when_not_to_use:
  - Rows that need multi-select plus a bulk-action bar — use `data-table-bulk-actions`.
  - A small, fixed set of rows with no search/filter/pagination — a plain `Table` is enough.
  - Card-based catalog/gallery tiles rather than tabular rows — use `card-grid`.

anti_patterns:
  - Reimplementing sorting/pagination by hand instead of using `DataTable` + `DataTablePagination`.
  - Using `InputSearch` for discrete-value filtering (status, type) — those belong in `Filter`, not free-text.
  - Omitting the `PageHeader` so the screen has no title or home for its primary action.
  - Placing per-row selection checkboxes here without the bulk-action bar — if you need selection, adopt `data-table-bulk-actions`.

components:
  - PageHeader
  - DataTable
  - InputSearch
  - Filter
  - Button

demo: apps/demos/src/patterns/TableViewDemo.tsx

# Approved starting point. Header on top, search + filters in a toolbar row, then
# the DataTable with its pagination.
example: |
  function DevicesView({ columns, rows, onSearch, onCreate }) {
    return (
      <div className="flex flex-col gap-4">
        <PageHeader>
          <PageHeaderRow>
            <PageHeaderTitle>Devices</PageHeaderTitle>
            <PageHeaderActions>
              <Button onClick={onCreate}>Add device</Button>
            </PageHeaderActions>
          </PageHeaderRow>
        </PageHeader>
        <div className="flex items-center gap-2">
          <InputSearch
            className="max-w-xs"
            placeholder="Search devices…"
            onChange={(e) => onSearch(e.target.value)}
          />
          <Filter count={2}>Status</Filter>
          <Filter>Type</Filter>
        </div>
        <DataTable columns={columns} data={rows} />
      </div>
    );
  }
