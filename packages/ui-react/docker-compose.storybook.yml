# packages/ui-react/docker-compose.storybook.yml
#
# Build context is the repo root (../..) because the Dockerfile needs the
# workspace manifests (pnpm-workspace.yaml, pnpm-lock.yaml) to install deps.
# Host volume paths in this file are resolved relative to THIS file's
# directory (packages/ui-react/), so e.g. ./storybook-static refers to
# packages/ui-react/storybook-static.
#
# Invoke from anywhere with:
#   docker compose -f packages/ui-react/docker-compose.storybook.yml up ...
#
# `platform: linux/amd64` is pinned on every service so image builds and Chromium
# renders are byte-for-byte reproducible against CI (GitHub `ubuntu-latest` =
# amd64). Without it, Apple-Silicon (arm64) hosts render subtly different font
# antialiasing and every baseline drifts vs CI. On amd64 hosts this is a no-op;
# on arm64 it runs under emulation (slower, but the baselines actually match CI).
services:
  storybook:
    build:
      context: ../..
      dockerfile: packages/ui-react/Dockerfile.storybook
    image: ui-react-storybook
    platform: linux/amd64
    ports:
      - '6006:6006'
    # Serve the pre-built static output from the host — no build step in Docker
    volumes:
      - ./storybook-static:/app/packages/ui-react/storybook-static:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:6006 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ── THE PER-TEST TIMEOUT IS *NOT* CONFIGURED HERE, AND THAT IS DELIBERATE ────
  # `UI/Radio` and `UI/Toast` intermittently fail this runner with
  # `Exceeded timeout of 15000 ms` — 3 tests × 15 s ≈ the 46.8 s those suites
  # reported — while the same run records ZERO snapshot failures. Under the old
  # `light && dark` chain that unrelated flake silently cancelled the whole dark
  # half of the corpus (#111).
  #
  # `--testTimeout=<n>` was tried here and REMOVED because it is INERT. In
  # `@storybook/test-runner@0.24.4` the flag exists only as a commander
  # declaration in `dist/test-storybook.js` — parsed and never forwarded to jest.
  # Measured, not inferred: a run at `--testTimeout=1000` passed all 4 tests of
  # `ui-label` and jest never mentioned 1000 ms. Do not re-add it; it silently
  # does nothing, which is worse than leaving the default visible.
  #
  # The supported route is a jest config (`test-storybook --eject` writes
  # `test-runner-jest.config.js`, where `testTimeout` IS honoured). Not taken yet:
  # the failure is CONTENTION-dependent, not intrinsic. Running those two suites
  # alone at the 15 s limit passes 9/9 with zero timeouts — they only blow the
  # limit under the full ~163-suite corpus at `--maxWorkers=4` on emulated CPU. So
  # `maxWorkers` may be the better lever than the ceiling, and neither can be
  # validated without reproducing a probabilistic flake. Left measured and
  # unfixed rather than papered over.
  test-runner:
    build:
      context: ../..
      dockerfile: packages/ui-react/Dockerfile.storybook
    image: ui-react-storybook
    platform: linux/amd64
    # `sh -c` so `$$VISUAL_TEST_ARGS` expands *inside* the container (the `$$`
    # escapes Compose's own interpolation). Unquoted on purpose: it must
    # word-split into separate argv entries.
    command:
      - sh
      - -c
      - pnpm exec test-storybook --url http://storybook:6006 --maxWorkers=4 $$VISUAL_TEST_ARGS
    environment:
      - STORYBOOK_COLOR_MODE=${STORYBOOK_COLOR_MODE:-light}
      # Extra args forwarded by scripts/visual-capture.mjs (e.g. a jest
      # test-path pattern to capture a single story). Empty in normal runs.
      - VISUAL_TEST_ARGS=${VISUAL_TEST_ARGS:-}
    depends_on:
      storybook:
        condition: service_healthy
    volumes:
      - ./test/__snapshots__:/app/packages/ui-react/test/__snapshots__
