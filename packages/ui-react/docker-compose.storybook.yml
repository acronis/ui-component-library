# packages/ui-react/docker-compose.storybook.yml
#
# Build context is the repo root (../..) because the Dockerfile needs the
# workspace manifests (pnpm-workspace.yaml, pnpm-lock.yaml) to install deps.
# Host volume paths in this file are resolved relative to THIS file's
# directory (packages/ui-react/), so e.g. ./storybook-static refers to
# packages/ui-react/storybook-static.
#
# Invoke from anywhere with:
#   docker compose -f packages/ui-react/docker-compose.storybook.yml up ...
#
# `platform: linux/amd64` is pinned on every service so image builds and Chromium
# renders are byte-for-byte reproducible against CI (GitHub `ubuntu-latest` =
# amd64). Without it, Apple-Silicon (arm64) hosts render subtly different font
# antialiasing and every baseline drifts vs CI. On amd64 hosts this is a no-op;
# on arm64 it runs under emulation (slower, but the baselines actually match CI).
services:
  storybook:
    build:
      context: ../..
      dockerfile: packages/ui-react/Dockerfile.storybook
    image: ui-react-storybook
    platform: linux/amd64
    ports:
      - '6006:6006'
    # Serve the pre-built static output from the host — no build step in Docker
    volumes:
      - ./storybook-static:/app/packages/ui-react/storybook-static:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:6006 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ── THE PER-TEST TIMEOUT IS SET IN `test-runner-jest.config.js`, NOT HERE ────
  # Heavy suites (`datagrid-virtualization`, `dropdownmenu`, `popover`; formerly
  # `UI/Radio` / `UI/Toast`) intermittently fail with `Exceeded timeout of 15000
  # ms` while the same run records ZERO snapshot failures — a single such timeout
  # makes the container exit non-zero and `scripts/visual-capture.mjs` reports the
  # whole mode as FAILED, masking the real snapshot verdict.
  #
  # `--testTimeout=<n>` is INERT here: in `@storybook/test-runner@0.24.4` the flag
  # is a commander declaration in `dist/test-storybook.js`, parsed and never
  # forwarded to jest (measured: `--testTimeout=1000` left jest at its default).
  # Do not re-add it. The supported route — and the one now taken — is a jest
  # config; `test-runner-jest.config.js` at the package root sets
  # `testTimeout: 60_000`, which jest honours. The failure is CONTENTION-dependent
  # (those suites pass 9/9 alone at 15 s; they only blow the limit under the full
  # ~163-suite corpus on emulated CPU — and worse under memory pressure: the
  # `linux/amd64` image on an `arm64` host can hit Docker's RAM ceiling and
  # thrash, which is what scattered 196–253 s timeouts across UNRELATED suites
  # like tour/calendar/checkbox point to). Worker count is the `VISUAL_MAX_WORKERS`
  # knob below (default 4 for CI, which has neither emulation nor that pressure);
  # lowering it on an emulated host — e.g. 2 — gives MORE headroom per suite, so
  # this 60s ceiling gets more comfortable, not less. The generous ceiling clears
  # the timeout regardless of worker count; only a test that would otherwise time
  # out takes longer.
  test-runner:
    build:
      context: ../..
      dockerfile: packages/ui-react/Dockerfile.storybook
    image: ui-react-storybook
    platform: linux/amd64
    # `sh -c` so `$$VISUAL_TEST_ARGS` expands *inside* the container (the `$$`
    # escapes Compose's own interpolation). Unquoted on purpose: it must
    # word-split into separate argv entries.
    # `${VISUAL_MAX_WORKERS:-4}` (single `$`) is the opposite: Compose interpolates
    # it from the host env at parse time — default 4 (unchanged for CI), lower it
    # (e.g. VISUAL_MAX_WORKERS=2) on an emulated/RAM-constrained host. `:-` also
    # covers an EMPTY value, falling back to 4 rather than emitting a bare
    # `--maxWorkers=` (same empty-string guard as VISUAL_FAILURE_THRESHOLD below).
    command:
      - sh
      - -c
      - pnpm exec test-storybook --url http://storybook:6006 --maxWorkers=${VISUAL_MAX_WORKERS:-4} $$VISUAL_TEST_ARGS
    environment:
      - STORYBOOK_COLOR_MODE=${STORYBOOK_COLOR_MODE:-light}
      # Extra args forwarded by scripts/visual-capture.mjs (e.g. a jest
      # test-path pattern to capture a single story). Empty in normal runs.
      - VISUAL_TEST_ARGS=${VISUAL_TEST_ARGS:-}
      # Per-story image-diff gate. Empty → the runner's 0.5% default (CI + normal
      # captures). Set to 0 for a diagnostic that exposes sub-0.5% diffs (#101),
      # e.g. VISUAL_FAILURE_THRESHOLD=0 … -- ui-avatar. Propagated from the host
      # env through scripts/visual-capture.mjs (which spawns compose with the
      # full process env).
      - VISUAL_FAILURE_THRESHOLD=${VISUAL_FAILURE_THRESHOLD:-}
    depends_on:
      storybook:
        condition: service_healthy
    volumes:
      - ./test/__snapshots__:/app/packages/ui-react/test/__snapshots__
