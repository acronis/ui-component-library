# .github/workflows/visual-regression.yml
name: Visual Regression

on: [pull_request]

permissions:
  contents: read
  pull-requests: read

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ui-react
            filter: '@constructor-lab/ui-react'
            dir: packages/ui-react
            color_mode: light
          - name: ui-react
            filter: '@constructor-lab/ui-react'
            dir: packages/ui-react
            color_mode: dark
          # ── The four profiles that own no baselines ──────────────────────────
          # `[data-theme]` and the OS `prefers-color-scheme` are two independent
          # inputs; the two legs above pin the attribute and leave the OS at
          # light, covering two of the six states the pair can be in. These four
          # are the rest of the cross product, and each re-renders an EXISTING
          # baseline under a different theme input rather than recording its own:
          #
          #   system-dark   no attribute, OS dark   -> must equal `--dark` PNGs
          #   system-light  no attribute, OS light  -> must equal light PNGs
          #   forced-light  attr light,  OS dark    -> must equal light PNGs
          #   forced-dark   attr dark,   OS dark    -> must equal `--dark` PNGs
          #
          # Any diff is styling that keyed off the attribute instead of resolving
          # through a token, or a `prefers-color-scheme` fallback firing where it
          # should not. See packages/ui-react/.storybook/visual-regression.ts.
          #
          # `subset: true` is what routes a leg to the script instead of `docker
          # compose`, and it is a matrix field rather than a `color_mode !=` list
          # in the step conditions: those lists had to name every profile, so
          # adding a fifth silently ran it as a baseline-owning leg — an
          # `--update`-less check, but one whose story-count assertion never
          # applied. Each of these runs a curated ~16% subset, so a leg costs a
          # fraction of a full one. They go THROUGH
          # scripts/visual-capture.mjs because the script owns the subset
          # resolver and the story-count assertion — a filtered run that silently
          # matched fewer files would otherwise pass green.
          - name: ui-react
            filter: '@constructor-lab/ui-react'
            dir: packages/ui-react
            color_mode: system-dark
            subset: true
          - name: ui-react
            filter: '@constructor-lab/ui-react'
            dir: packages/ui-react
            color_mode: system-light
            subset: true
          - name: ui-react
            filter: '@constructor-lab/ui-react'
            dir: packages/ui-react
            color_mode: forced-light
            subset: true
          - name: ui-react
            filter: '@constructor-lab/ui-react'
            dir: packages/ui-react
            color_mode: forced-dark
            subset: true
    name: visual-regression (${{ matrix.name }}${{ matrix.color_mode && format(', {0}', matrix.color_mode) || '' }})
    steps:
      - uses: actions/checkout@v6

      # Snapshots only need refreshing when a library's own components / styles /
      # Storybook config change, or when the shared design tokens (which can alter
      # any rendered color) change. The job always runs and reports a status; the
      # build + Docker steps below are skipped when nothing relevant changed, so
      # docs-only / tooling-only PRs don't pay for a full Storybook + Playwright run.
      - name: Detect relevant changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            ui-react:
              - 'packages/ui-react/src/**'
              - 'packages/ui-react/.storybook/**'
              - 'packages/ui-react/package.json'
              - 'packages/ui-react/test-runner-jest.config.js'
              - 'packages/ui-react/Dockerfile.storybook'
              - 'packages/ui-react/docker-compose.storybook*.yml'
              - 'packages/tokens/**'
              - 'packages/icons-react/**'
              - '.github/workflows/visual-regression.yml'

      - name: Setup PNPM
        if: steps.changes.outputs[matrix.name] == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.changes.outputs[matrix.name] == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Get pnpm store directory
        if: steps.changes.outputs[matrix.name] == 'true'
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        if: steps.changes.outputs[matrix.name] == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        if: steps.changes.outputs[matrix.name] == 'true'
        run: pnpm install --frozen-lockfile

      # Vite module cache + Storybook builder cache — key on source so only
      # changed files are recompiled when the cache is restored.
      - name: Cache Storybook build
        if: steps.changes.outputs[matrix.name] == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ${{ matrix.dir }}/node_modules/.vite
            ${{ matrix.dir }}/node_modules/.cache/storybook
          key: storybook-${{ matrix.name }}-${{ runner.os }}-${{ hashFiles(format('{0}/src/**', matrix.dir), format('{0}/.storybook/**', matrix.dir), format('{0}/package.json', matrix.dir)) }}
          restore-keys: storybook-${{ matrix.name }}-${{ runner.os }}-

      # ui-react depends on generated @constructor-lab/icons-react output
      # (generated sources + dist/ are gitignored). Build that package (and its
      # own prerequisites) before Storybook so imports resolve. Avoid broad
      # ui-react recursive builds here: they also pull in tokens/style-dictionary,
      # which is unrelated to visual snapshots.
      - name: Build workspace dependencies
        if: matrix.name == 'ui-react' && steps.changes.outputs[matrix.name] == 'true'
        run: pnpm --filter @constructor-lab/icons-react... run build

      - name: Build Storybook
        if: steps.changes.outputs[matrix.name] == 'true'
        run: pnpm --filter ${{ matrix.filter }} storybook:build

      # Docker only serves the pre-built static output and runs Playwright.
      # --build rebuilds the image when Dockerfile or .storybook config changes.
      - name: Run visual regression tests
        if: steps.changes.outputs[matrix.name] == 'true' && !matrix.subset
        env:
          STORYBOOK_COLOR_MODE: ${{ matrix.color_mode || 'light' }}
          # 2, not the compose default of 4. `components-datagrid-virtualization`
          # runs in 23.8s on its own but had a single test exceed 60s AND then
          # 120s on a full-corpus CI run — 10-25x starvation, which is
          # oversubscription rather than slowness: four jest workers each driving
          # Chromium, alongside the Storybook server, on a shared runner.
          #
          # Raising the ceiling was the wrong lever and is not what fixed it; a
          # starved test simply burns the larger budget too (the suite went from
          # 147s to 209s when the ceiling doubled, because the doomed test ran
          # twice as long before being killed). Fewer workers give each suite more
          # CPU, which is what the compose file's own note recommends.
          VISUAL_MAX_WORKERS: 2
        run: docker compose -f ${{ matrix.dir }}/docker-compose.storybook.yml up --build --abort-on-container-exit --exit-code-from test-runner

      # `--skip-build` because the cached "Build Storybook" step above already
      # produced storybook-static; the script supplies the subset test-path
      # pattern, refuses to run if a subset title no longer exists, and fails the
      # job if jest ran a different number of stories than the subset defines.
      - name: Run visual regression tests (system-theme subset)
        if: steps.changes.outputs[matrix.name] == 'true' && matrix.subset
        env:
          VISUAL_MAX_WORKERS: 2
        run: node ${{ matrix.dir }}/scripts/visual-capture.mjs --skip-build --mode ${{ matrix.color_mode }}

      - name: Upload diff artifacts on failure
        if: failure() && steps.changes.outputs[matrix.name] == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: visual-regression-diffs-${{ matrix.name }}${{ matrix.color_mode && format('-{0}', matrix.color_mode) || '' }}
          path: ${{ matrix.dir }}/test/__snapshots__/__diff_output__/
