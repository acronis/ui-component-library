packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'

# Single source of truth for dependency versions used by more than one
# workspace. Workspaces refer to these with "catalog:" — pnpm rewrites
# this to the concrete version when publishing.
catalog:
  # React + types
  react: 19.2.7
  react-dom: 19.2.7
  '@types/react': 19.2.17
  '@types/react-dom': 19.2.3
  '@types/node': 26.1.1

  # Base UI — primitive set for the packages/ui-react library
  # (a direct dependency there).
  '@base-ui/react': 1.6.0

  # Toolchain
  typescript: 6.0.3
  eslint: 10.6.0
  # Vite 8 (rolldown bundler). Was previously held on Vite 6 because rolldown
  # miscompiled es-toolkit's CommonJS compat modules (via recharts), breaking the
  # published UI library at runtime in SSR (apps/docs prerender, "t is not a
  # function"). Fixed as of vite 8.1.4 — verified: the docs prerender builds all
  # 118 pages cleanly. @vitejs/plugin-react moves to 6.x (requires vite ^8).
  vite: 8.1.4
  vitest: 4.1.10
  # Cross-workspace runtime deps, shared so private apps + the published
  # packages/ui-react library stay on one version and don't drift.
  react-hook-form: 7.81.0
  '@hookform/resolvers': 5.4.0
  '@tanstack/react-table': 8.21.3
  '@tanstack/react-virtual': 3.14.5
  recharts: 3.9.2
  date-fns: 4.4.0
  react-day-picker: 10.0.1
  embla-carousel-react: 8.6.0
  sonner: 2.0.7
  next-themes: 0.4.6
  # NOTE: zod is intentionally NOT in the catalog yet, though every consumer
  # (apps/demo, apps/demos, the UI lib) is now on 4.x — the 3→4 alignment has
  # landed. Cataloguing it is a separate, purely mechanical follow-up.

  # Tailwind v4 ecosystem
  tailwindcss: 4.3.2
  '@tailwindcss/postcss': 4.3.2
  tw-animate-css: 1.4.0

  # JSON-schema validation — shared by the data packages (packages/tokens,
  # packages/ui-spec), which validate their manifests/specs against
  # ajv-compiled schemas. No runtime deps; ajv is dev-only.
  ajv: 8.20.0
  ajv-cli: 5.0.0
  ajv-formats: 3.0.1

  # Style Dictionary v5 — used by tools/style-dictionary, which builds
  # tokens → packages/tokens (per-brand CSS, per-component CSS,
  # Tailwind presets, DTCG).
  style-dictionary: 5.5.0
  # SVGO v4 — SVG optimizer used by the icon tooling: tools/figma-icons-fetcher.
  svgo: 4.0.1

# Pin transitive deps that we don't want pnpm to bump.
overrides:
  prismjs: 1.30.0
  postcss: 8.5.10
